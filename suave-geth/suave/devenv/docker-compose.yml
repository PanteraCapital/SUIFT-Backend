version: "3.8"

services:
  suave-mevm:
    build: ../..
    command:
      - --dev
      - --dev.gaslimit=30000000
      - --http
      - --http.port=8545
      - --http.addr=0.0.0.0
      - --http.vhosts=*
      - --http.corsdomain=*
      - --ws
      - --ws.origins=*
      - --ws.addr=0.0.0.0
      # The container must listen on 0.0.0.0 to be reachable through the
      # published ports, so the fresh developer key needs this flag to be
      # unlocked. HTTP and WebSocket clients still cannot sign with it.
      - --allow-insecure-unlock
    depends_on:
      - suave-enabled-chain
    ports:
      - 127.0.0.1:8545:8545
      - 127.0.0.1:8546:8546
  suave-enabled-chain:
    build: ../..
    command:
      - --dev
      - --dev.gaslimit=30000000
      - --http
      - --ws
    ports:
      - 8555:8545
